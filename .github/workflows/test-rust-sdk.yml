name: test-rust-sdk

on:
  pull_request:
    paths:
      - "packages/rust-sdk/**"
      - ".github/workflows/test-rust-sdk.yml"
  push:
    branches: [main, staging, dev]
    paths:
      - "packages/rust-sdk/**"
      - ".github/workflows/test-rust-sdk.yml"
  workflow_dispatch:

concurrency:
  group: test-rust-sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust-sdk-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/rust-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/rust-sdk/target
          key: cargo-rust-sdk-${{ runner.os }}-${{ hashFiles('packages/rust-sdk/Cargo.lock') }}
          restore-keys: cargo-rust-sdk-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

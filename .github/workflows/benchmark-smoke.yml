name: Benchmark Smoke

on:
  pull_request:
    paths:
      - 'services/server/src/**'
      - 'services/server/Cargo.toml'
      - 'services/server/Cargo.lock'
      - 'infra/memwal-publisher/**'
      - '.github/workflows/benchmark-smoke.yml'
      - 'docs/relayer/benchmark-ci-setup.md'
  push:
    branches:
      - main
      - staging
      - dev
    paths:
      - 'services/server/src/**'
      - 'services/server/Cargo.toml'
      - 'services/server/Cargo.lock'
      - 'infra/memwal-publisher/**'
      - '.github/workflows/benchmark-smoke.yml'
      - 'docs/relayer/benchmark-ci-setup.md'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  smoke:
    name: Rust Compile Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/server

      - name: Cargo check
        working-directory: services/server
        run: cargo check

      - name: Cargo check publisher
        working-directory: infra/memwal-publisher
        run: cargo check

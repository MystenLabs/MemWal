[package]
name = "memwal-indexer"
version = "0.1.0"
edition = "2021"
# roaring 0.11 (via the framework graph) requires rustc 1.90; the Dockerfile pins rust:1.90.
rust-version = "1.90"

[dependencies]
# Checkpoint ingestion framework — replaces the JSON-RPC/gRPC event-query indexer
# (Sui sunsets JSON-RPC 2026-07-31). Ingests full checkpoints from a remote store;
# needs no RPC event index. Pinned to branch = "testnet" (matches dopamint-arena).
sui-indexer-alt-framework = { git = "https://github.com/MystenLabs/sui.git", branch = "testnet" }
move-core-types = { git = "https://github.com/MystenLabs/sui.git", branch = "testnet" }
diesel = { version = "2.3", features = ["postgres"] }
diesel-async = { version = "0.9", features = ["bb8", "postgres"] }
diesel_migrations = "2.3"
# Pin ring as the process-default rustls CryptoProvider: the framework's ingestion
# client fetches checkpoints over HTTPS and rustls 0.23 panics if it cannot pick one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
bcs = "0.1"
clap = { version = "4", features = ["derive"] }
url = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dotenvy = "0.15"
async-trait = "0.1"
tracing = "0.1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }

[package]
name = "memwal-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database (PostgreSQL + pgvector)
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid"] }
pgvector = { version = "0.4", features = ["sqlx"] }

# Auth
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"

# SEAL encryption/decryption, native Rust path.
seal-sdk = { git = "https://github.com/MystenLabs/seal.git", rev = "e51c8f9628b26c85e4cc3c393aa607ed55b1c6f0", package = "seal-sdk" }
seal-crypto = { git = "https://github.com/MystenLabs/seal.git", rev = "e51c8f9628b26c85e4cc3c393aa607ed55b1c6f0", package = "crypto" }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "5f87e04bb21d295ef6b39375a06615d45cbb906c", features = ["aes"] }
sui-sdk-types = { git = "https://github.com/MystenLabs/sui-rust-sdk.git", rev = "e494a36a76a0aab8c5d66d5557995faee5c1fb09", package = "sui-sdk-types", features = ["serde", "hash"] }
bcs = "0.1.6"
rand = "0.8.5"

# Background job queue — persistent metadata+transfer tasks
apalis     = { version = "0.7", default-features = false, features = ["tracing"] }
apalis-sql = { version = "0.7", features = ["postgres", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus = "0.13"

# HTTP client (for Sui RPC onchain verification)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Rate limiting (Redis-backed)
redis = { version = "0.27", features = ["tokio-comp"] }

# Utils
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
percent-encoding = "2"

# Example only. The ML scrape network, auth, and retention are not confirmed.
# Do not point this at production until that environment is owned and reviewed.
#
# The dev relayer currently serves GET /metrics without authentication
# (observed 200 on https://relayer.dev.memwal.ai/metrics, 2026-10-12).
# Leave it unchanged until the collector path is confirmed. Adding auth
# before that will break the existing OpenTelemetry scrape.

scrape_configs:
  - job_name: memwal-relayer
    scrape_interval: 15s
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["${RELAYER_METRICS_TARGET}"]
        labels:
          service: memwal-relayer
          environment: unconfirmed

[package]
name = "memwal-client"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async & HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto & Auth
ed25519-dalek = { version = "2", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
blake2 = "0.10"
percent-encoding = "2"
rand = "0.8"

# Error Handling
thiserror = "1"
